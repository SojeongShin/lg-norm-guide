name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble static site (stlite)
        run: |
          mkdir -p _site/corpus
          cp site/index.html _site/
          cp app.py rag.py demo.py _site/
          cp corpus/*.txt _site/corpus/
          # 배포마다 파일 URL에 커밋 해시를 붙여 브라우저 캐시(최대 10분)를 우회
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
