<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>LENS - LG Employee Norm Support</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.10.0/build/stlite.css" />
    <style>
      #loading { font-family: sans-serif; text-align: center; margin-top: 30vh; color: #555; }
    </style>
  </head>
  <body>
    <div id="root"><p id="loading">🔍 LENS(LG Employee Norm Support)를 불러오는 중입니다… (첫 로딩은 10~30초 걸릴 수 있습니다)</p></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.10.0/build/stlite.js";
      // 브라우저(Pyodide)에서 실행되는 데모 모드 전용 배포본 - API 키를 사용하지 않는다.
      mount(
        {
          requirements: [],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
            "rag.py": { url: "./rag.py" },
            "demo.py": { url: "./demo.py" },
            "corpus/anticorruption.txt": { url: "./corpus/anticorruption.txt" },
            "corpus/ethics.txt": { url: "./corpus/ethics.txt" },
            "corpus/conduct.txt": { url: "./corpus/conduct.txt" },
            "corpus/tax.txt": { url: "./corpus/tax.txt" },
          },
          streamlitConfig: { "client.toolbarMode": "viewer" },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
